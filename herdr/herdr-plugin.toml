id = "openpeon"
name = "OpenPeon"
version = "0.2.0"
min_herdr_version = "0.8.0"
description = "Volume and preset popup for the focused Claude Code or pi session"
platforms = ["macos", "linux"]

# Prefer the pi-deployed script because it can resolve both pi and Claude.
# Fall back to the Claude deployment for machines without the pi target.
# The action resolves the session and sizes the popup, then opens the pane.
[[actions]]
id = "popup"
title = "OpenPeon: volume / preset popup"
command = ["bash", "-c", "script=\"$HOME/.pi/agent/openpeon/tmux/openpeon-popup.sh\"; [ -f \"$script\" ] || script=\"$HOME/.claude/openpeon/tmux/openpeon-popup.sh\"; exec bash \"$script\" popup-herdr"]

[[panes]]
id = "popup"
title = " openpeon "
placement = "popup"
command = ["bash", "-c", "script=\"$HOME/.pi/agent/openpeon/tmux/openpeon-popup.sh\"; [ -f \"$script\" ] || script=\"$HOME/.claude/openpeon/tmux/openpeon-popup.sh\"; exec bash \"$script\" popup-herdr-pane"]
