id = "openpeon"
name = "OpenPeon"
version = "0.1.0"
min_herdr_version = "0.8.0"
description = "Volume and preset popup for the OpenPeon sounds of the focused Claude Code session"
platforms = ["macos", "linux"]

# Both commands run the deployed script, not the repo copy, so the popup
# always matches the deployed presets and state under ~/.claude/openpeon.
# The action resolves the session and sizes the popup, then opens the pane.
[[actions]]
id = "popup"
title = "OpenPeon: volume / preset popup"
command = ["bash", "-c", "exec bash \"$HOME/.claude/openpeon/tmux/openpeon-popup.sh\" popup-herdr"]

[[panes]]
id = "popup"
title = " openpeon "
placement = "popup"
command = ["bash", "-c", "exec bash \"$HOME/.claude/openpeon/tmux/openpeon-popup.sh\" popup-herdr-pane"]
